<style>
  :root{
    --black:#0C0B0A;
    --bg:#FAF8F3;
    --surface:#FFFFFF;
    --surface-2:#F5F2EA;
    --surface-3:#ECE6D6;
    --line:#E7E1D0;
    --line-strong:#D6CCAF;
    --ink:#17151A;
    --dim:#6E6A5E;
    --blue:#5B5648;
    --blue-dim:rgba(91,86,72,.08);
    --blue-line:rgba(91,86,72,.28);
    --blue-bright:#8B7F5C;
    --cyan:#4A7A6D;
    --cyan-dim:rgba(74,122,109,.12);
    --good:#2F7D4F;
    --bad:#B3261E;
    --accent:#B8912F;
    --accent-2:#8B6F1D;
    --accent-gradient:linear-gradient(135deg,#EAC766 0%,#B8912F 55%,#8B6F1D 100%);
    --radius:14px;
    --radius-sm:9px;
    --maxw:560px;
  }
  body.dark{
    --bg:#0B0A0C;
    --surface:#17151A;
    --surface-2:#1E1B22;
    --surface-3:#27242C;
    --line:#2B2830;
    --line-strong:#3A3640;
    --ink:#F2EFE9;
    --dim:#A39D8E;
    --blue:#8C87A0;
    --blue-dim:rgba(140,135,160,.14);
    --blue-line:rgba(140,135,160,.35);
    --blue-bright:#A79FC0;
    --cyan:#5FA79A;
    --cyan-dim:rgba(95,167,154,.14);
    --accent:#D9B24C;
    --accent-2:#F0C868;
    --accent-gradient:linear-gradient(135deg,#F3D98A 0%,#D9B24C 50%,#A9791F 100%);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;}
  body{min-height:100vh;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;transition:background .2s;}
  h1,h2,h3,.display{
    font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:-.01em;
    line-height:1.05;margin:0;color:var(--ink);
  }
  #app{max-width:var(--maxw);margin:0 auto;min-height:100vh;position:relative;padding-bottom:90px;}

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#18141F 0%,var(--black) 100%);
    padding:16px 18px 14px;
    display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid rgba(255,255,255,.06);
  }
  .topbar .brand{display:flex;align-items:center;gap:8px;font-family:'Sora',sans-serif;}
  .topbar .brand img{width:32px;height:32px;border-radius:50%;display:block;}
  .topbar .brand .b1{font-size:16.5px;font-weight:700;color:#fff;letter-spacing:.02em;}
  .topbar .brand .b2{font-size:16.5px;font-weight:800;background:var(--accent-gradient);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.02em;}
  .brand-font{font-family:'Sora',sans-serif !important;font-weight:700;letter-spacing:.01em;}
  .topbar-right{display:flex;align-items:center;gap:14px;}
  .topbar .streak{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#A6A2BC;font-weight:600;}
  .topbar .streak b{color:#22D3EE;font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;}
  .topbar .icon-btn{color:#CBC8DC;}

  /* ---------- Tab panels ---------- */
  .panel{display:none;padding:18px;animation:fade .18s ease;}
  .panel.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  /* ---------- Bottom nav ---------- */
  .bottomnav{
    position:fixed;bottom:0;left:0;right:0;z-index:30;background:linear-gradient(0deg,#18141F 0%,var(--black) 100%);
    display:flex;max-width:var(--maxw);margin:0 auto;
    box-shadow:0 -8px 24px rgba(0,0,0,.25);
    border-top:1px solid rgba(255,255,255,.06);
  }
  .navbtn{
    flex:1;background:none;border:none;color:#726E88;padding:12px 4px 14px;
    display:flex;flex-direction:column;align-items:center;gap:5px;
    font-family:'Inter',sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.02em;
    cursor:pointer;position:relative;
  }
  .navbtn svg{width:21px;height:21px;stroke:#726E88;fill:none;stroke-width:1.8;transition:stroke .15s;}
  .navbtn.active{color:#fff;}
  .navbtn.active svg{stroke:#D9B24C;}
  .navbtn.active::before{
    content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:22px;height:2.5px;
    background:var(--accent-gradient);border-radius:0 0 3px 3px;
  }

  /* ---------- Generic bits ---------- */
  .section-title{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:7px;}
  .section-title::before{content:'';width:8px;height:8px;background:var(--accent);border-radius:2px;flex-shrink:0;}
  .toggle-header{display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);font-weight:700;margin:0 0 10px;}
  .toggle-header .th-label{display:flex;align-items:center;gap:7px;}
  .toggle-header .th-label::before{content:'';width:8px;height:8px;background:var(--accent);border-radius:2px;flex-shrink:0;}
  .toggle-header .th-icon{font-family:'Space Grotesk',sans-serif;font-size:15px;color:var(--ink);}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:0 2px 12px rgba(76,29,149,.05);}
  .row{display:flex;gap:10px;}
  .row > *{flex:1;}
  .btn{
    appearance:none;border:none;cursor:pointer;font-family:'Inter',sans-serif;font-weight:700;
    font-size:14px;padding:14px 16px;border-radius:var(--radius-sm);text-align:center;
    background:var(--surface-3);color:var(--ink);border:1px solid var(--line-strong);
    transition:transform .1s;
  }
  .btn:active{transform:scale(.97);}
  .btn:disabled{opacity:.55;cursor:default;}
  .btn-primary{background:var(--accent-gradient);color:#fff;border:none;box-shadow:0 4px 14px rgba(0,0,0,.22);}
  .btn-danger{background:#FFF0EF;color:#C0342A;border-color:#F5D2CE;}
  .btn-ghost{background:var(--surface);border:1.5px solid var(--accent);color:var(--accent);}
  .btn-sm{padding:9px 12px;font-size:12.5px;border-radius:8px;}
  .btn-block{width:100%;}
  input,select,textarea{
    width:100%;background:var(--surface-2);border:1.5px solid transparent;color:var(--ink);
    padding:12px 13px;border-radius:var(--radius-sm);font-family:'Inter',sans-serif;font-size:14.5px;
    transition:border-color .15s;
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--surface);}
  input::placeholder{color:#9AA0AE;}
  label{font-size:11px;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:6px;}
  .field{margin-bottom:12px;}
  .pill{
    display:inline-flex;align-items:center;padding:4px 10px;border-radius:20px;font-size:10.5px;font-weight:700;
    background:var(--accent);color:#fff;border:1px solid var(--accent);text-transform:uppercase;letter-spacing:.03em;
  }
  .pill.blue{background:var(--blue-dim);color:var(--blue);border-color:var(--blue-line);}
  .pill.cyan{background:var(--cyan-dim);color:#0B7FAE;border-color:rgba(14,165,233,.4);}
  .divider{height:1px;background:var(--line);margin:14px 0;}
  .empty{color:var(--dim);font-size:13.5px;padding:18px 0;text-align:center;line-height:1.5;}
  .hidden{display:none !important;}
  .icon-btn{background:none;border:none;color:var(--dim);cursor:pointer;padding:4px;}
  .icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;}
  .hint{font-size:11.5px;color:var(--dim);margin:6px 0 4px;min-height:14px;}

  /* ---------- Toggle switch ---------- */
  .switch{position:relative;display:inline-block;width:46px;height:26px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;position:absolute;}
  .switch .slider{position:absolute;cursor:pointer;inset:0;background:var(--line-strong);transition:.2s;border-radius:26px;}
  .switch .slider::before{position:absolute;content:"";height:20px;width:20px;left:3px;bottom:3px;background:#fff;transition:.2s;border-radius:50%;box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .switch input:checked + .slider{background:var(--accent);}
  .switch input:checked + .slider::before{transform:translateX(20px);}
  .settings-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);}
  .settings-row:last-child{border-bottom:none;}
  .settings-row span{font-weight:700;font-size:14px;}

  /* ---------- Badges ---------- */
  .badge{display:inline-flex;align-items:center;gap:5px;background:var(--accent);color:#fff;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;}

  /* ---------- Rank card ---------- */
  .rank-card{background:linear-gradient(135deg,var(--surface) 0%,var(--surface-2) 100%);}
  .rank-head{display:flex;align-items:center;gap:12px;}
  .rank-icon{font-size:32px;line-height:1;}
  .rank-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;}
  .rank-xp{font-size:12px;color:var(--dim);font-weight:600;}

  /* ---------- Momentum score ---------- */
  .momentum-card{display:flex;align-items:center;gap:16px;}
  .momentum-ring{width:84px;height:84px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .momentum-ring-inner{width:66px;height:66px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .momentum-ring-inner .num{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;line-height:1;}
  .momentum-ring-inner .lbl{font-size:8px;color:var(--dim);text-transform:uppercase;font-weight:700;letter-spacing:.04em;margin-top:2px;}
  .momentum-breakdown{flex:1;min-width:0;}
  .momentum-breakdown .mb-title{font-weight:700;font-family:'Space Grotesk',sans-serif;font-size:14px;margin-bottom:8px;}
  .momentum-breakdown .mb-row{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);margin-bottom:3px;}
  .momentum-breakdown .bar{height:5px;margin-bottom:7px;}

  /* ---------- Discoveries ---------- */
  .discovery-card{background:var(--blue-dim);border-color:var(--blue-line);}
  .discovery-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--blue-line);font-size:13px;line-height:1.4;}
  .discovery-item:last-child{border-bottom:none;}

  /* ---------- Future You ---------- */
  .future-card{background:linear-gradient(135deg,var(--surface) 0%,var(--surface-2) 100%);}
  .future-item{padding:10px 0;border-bottom:1px solid var(--line);}
  .future-item:last-child{border-bottom:none;}

  /* ---------- Physique picker ---------- */
  .physique-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px;}
  .physique-card{border:1.5px solid var(--line-strong);border-radius:var(--radius-sm);padding:10px;cursor:pointer;background:var(--surface-2);position:relative;}
  .physique-card.selected{border-color:var(--accent);background:var(--blue-dim);}
  .physique-card .pc-title{font-weight:700;font-size:12.5px;color:var(--ink);}
  .physique-card .pc-desc{font-size:10.5px;color:var(--dim);margin-top:3px;line-height:1.35;}
  .physique-card .pc-rec{position:absolute;top:-8px;right:8px;background:var(--good);color:#fff;font-size:9px;font-weight:800;padding:2px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em;}
  .suggest-callout{background:var(--blue-dim);border:1px solid var(--blue-line);border-radius:var(--radius-sm);padding:10px 12px;font-size:12.5px;color:var(--ink);margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;}

  /* ---------- Home ---------- */
  .hero{
    background:linear-gradient(150deg,#0A0908 0%,#1D1710 55%,#3A2C10 78%,#8B6F1D 100%);
    border-radius:var(--radius);padding:24px 20px 22px;margin-bottom:14px;
    position:relative;overflow:hidden;color:#fff;
    box-shadow:0 12px 32px rgba(0,0,0,.28);
    border:1px solid rgba(217,178,76,.25);
  }
  .hero::before{
    content:'';position:absolute;top:-60%;right:-30%;width:80%;height:160%;
    background:radial-gradient(circle,rgba(217,178,76,.16) 0%,transparent 65%);
    pointer-events:none;
  }
  .hero-label{font-size:10.5px;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.14em;font-weight:700;position:relative;}
  .hero-num{font-family:'Fraunces',serif;font-style:italic;font-weight:600;font-size:52px;color:#fff;margin:4px 0 2px;letter-spacing:-.01em;position:relative;}
  .hero-num span{background:var(--accent-gradient);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .hero-sub{font-size:12.5px;color:rgba(255,255,255,.65);position:relative;}
  .bar{height:6px;background:rgba(255,255,255,.14);border-radius:20px;overflow:hidden;}
  .bar > i{display:block;height:100%;background:var(--accent-gradient);border-radius:20px;transition:width .3s;}
  .bar.light{background:var(--surface-3);}
  .bar.light > i{background:var(--accent-gradient);}
  .bar.cyan > i{background:var(--cyan);}
  .macro-row{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.6);margin:8px 0 5px;position:relative;}
  .macro-row b{color:#fff;}
  .macro-row.dark{color:var(--dim);}
  .macro-row.dark b{color:var(--ink);}
  .quick-actions{display:flex;gap:10px;margin-top:16px;}
  .quick-actions .btn{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.22);}
  .quick-actions .btn-primary{background:#fff;color:var(--black);}

  .today-lift-card{display:flex;justify-content:space-between;align-items:center;}
  .today-lift-card .name{font-size:16px;font-weight:700;}
  .today-lift-card .meta{font-size:12px;color:var(--dim);margin-top:2px;}

  /* ---------- Lifts / Workout session ---------- */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0;}
  .stat-box{background:var(--accent);border-radius:var(--radius-sm);padding:12px 6px;text-align:center;}
  .stat-box .num{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;color:#fff;}
  .stat-box .lbl{font-size:9.5px;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.04em;font-weight:700;margin-top:3px;}
  .timer-display{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:40px;color:var(--ink);text-align:center;letter-spacing:-.02em;}
  .rest-display{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:32px;color:var(--accent);text-align:center;letter-spacing:-.02em;}
  .active-badge{
    display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;
    padding:5px 11px;border-radius:20px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;
  }
  .active-badge .dot{width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.9);animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  .session-exercise{border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px;margin-bottom:10px;background:var(--surface-2);}
  .session-exercise .se-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .session-exercise .se-name{font-weight:700;font-size:14.5px;font-family:'Space Grotesk',sans-serif;}
  .session-exercise .se-lasttime{font-size:11.5px;color:var(--dim);margin-bottom:8px;}

  /* ---------- Prescription box ---------- */
  .rx-box{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:11px 12px;margin-bottom:10px;}
  .rx-label{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;background:var(--accent-gradient);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:8px;}
  .rx-sets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px;}
  .rx-set{
    border:1.5px solid var(--accent);color:var(--accent);background:transparent;
    border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:700;cursor:pointer;
    transition:transform .1s;
  }
  .rx-set:active{transform:scale(.95);}
  .rx-set em{font-style:normal;font-size:9.5px;opacity:.7;font-weight:600;}
  .rx-set.warmup{border-color:var(--line-strong);color:var(--dim);}
  .rx-set.done{background:var(--accent);color:#fff;border-color:var(--accent);opacity:.65;}
  .rx-why{font-size:11.5px;color:var(--dim);line-height:1.45;}
  .rx-readiness{font-size:11.5px;color:var(--accent);font-weight:600;margin-top:5px;}
  .rx-last{font-size:10.5px;color:var(--dim);opacity:.8;margin-top:6px;}
  .set-chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
  .set-chip{
    background:var(--accent);border:1px solid var(--accent);border-radius:20px;padding:5px 10px;
    font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;color:#fff;
  }
  .set-chip button{background:none;border:none;color:rgba(255,255,255,.6);cursor:pointer;font-size:12px;padding:0;line-height:1;}
  .add-set-row{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;}

  .session-summary-card{cursor:pointer;}
  .session-summary-card .ss-head{display:flex;justify-content:space-between;align-items:flex-start;}
  .session-summary-card .ss-date{font-weight:700;font-size:14.5px;font-family:'Space Grotesk',sans-serif;}
  .session-summary-card .ss-meta{font-size:12px;color:var(--dim);margin-top:2px;}
  .session-summary-card .ss-stats{display:flex;gap:14px;margin-top:10px;font-size:12.5px;color:var(--dim);}
  .session-summary-card .ss-stats b{color:var(--ink);}
  .session-detail{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);}
  .exercise-log{padding:8px 0;border-bottom:1px solid var(--line);}
  .exercise-log:last-child{border-bottom:none;}
  .exercise-log .exname{font-weight:700;font-size:13.5px;}
  .exercise-log .sets{color:var(--dim);font-size:12.5px;margin-top:3px;}

  .pr-table{width:100%;border-collapse:collapse;}
  .pr-table td{padding:10px 4px;border-bottom:1px solid var(--line);font-size:13.5px;}
  .pr-table td:first-child{font-weight:700;}
  .pr-table .prval{text-align:right;color:var(--blue);font-weight:700;}
  .pr-table .prrm{text-align:right;color:var(--dim);font-size:11.5px;}
  .pr-table tr:last-child td{border-bottom:none;}

  /* ---------- Compare / stats ---------- */
  .compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .compare-box{background:var(--surface-2);border-radius:var(--radius-sm);padding:12px;text-align:center;}
  .compare-box .cb-label{font-size:10.5px;color:var(--dim);text-transform:uppercase;font-weight:700;letter-spacing:.03em;}
  .compare-box .cb-num{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;margin-top:2px;}
  .delta-up{color:var(--good);}
  .delta-down{color:var(--bad);}

  /* ---------- Water ---------- */
  .water-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .water-count{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;}
  .water-count span{font-size:12.5px;color:var(--dim);font-family:'Inter',sans-serif;font-weight:600;}

  /* ---------- Splits ---------- */
  .split-card{cursor:pointer;}
  .split-card .sc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .split-card .sc-title{font-size:16.5px;font-weight:700;color:var(--ink);font-family:'Space Grotesk',sans-serif;}
  .split-card .sc-desc{font-size:12.5px;color:var(--dim);margin-top:4px;line-height:1.4;}
  .split-card .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .split-card .pill{background:var(--surface-3);color:var(--dim);border-color:var(--line);}
  .split-day{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);}
  .split-day .sd-title{font-size:12px;font-weight:800;color:var(--blue);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;}
  .split-day ul{margin:0;padding-left:18px;font-size:13px;color:var(--dim);line-height:1.7;}
  .active-split-banner{
    display:flex;justify-content:space-between;align-items:center;background:var(--accent);
    border-radius:var(--radius-sm);padding:13px 14px;margin-bottom:14px;font-size:13px;color:#fff;
  }
  .active-split-banner b{color:#fff;}

  /* ---------- Chat ---------- */
  .chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 190px);}
  .chat-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .chat-head .ch-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;}
  .chat-scroll{flex:1;overflow-y:auto;padding:0 0 12px;display:flex;flex-direction:column;gap:10px;}
  .msg{max-width:82%;padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.5;white-space:pre-wrap;}
  .msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px;font-weight:500;}
  .msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px;color:var(--ink);}
  .msg.bot.typing{color:var(--dim);font-style:italic;}
  .chat-intro{text-align:center;padding:28px 10px 10px;}
  .chat-intro .gb-badge{
    width:58px;height:58px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;margin:0 auto 12px;
    overflow:hidden;box-shadow:0 4px 14px rgba(217,178,76,.3);
  }
  .chat-intro .gb-badge img{width:100%;height:100%;object-fit:cover;}
  .chat-intro h2{font-size:20px;}
  .chat-intro p{color:var(--dim);font-size:13px;margin-top:6px;}
  .chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px;}
  .chip{
    background:var(--surface);border:1.5px solid var(--accent);color:var(--accent);
    padding:8px 12px;border-radius:20px;font-size:12.5px;cursor:pointer;font-weight:600;
  }
  .chat-input-row{display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--line);}
  .chat-input-row input{flex:1;}
  .send-btn{
    background:var(--accent);border:none;color:#fff;width:46px;border-radius:var(--radius-sm);
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
  }
  .send-btn svg{width:19px;height:19px;fill:#fff;}
  .send-btn:disabled{opacity:.5;}

  /* ---------- Modal ---------- */
  .modal-overlay{position:fixed;inset:0;background:rgba(10,10,15,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
  .modal-overlay.hidden{display:none;}
  .modal{
    background:var(--surface);width:100%;max-width:var(--maxw);border-radius:22px 22px 0 0;
    padding:22px 18px 28px;max-height:85vh;overflow-y:auto;
    border-top:3px solid transparent;
    background-image:linear-gradient(var(--surface),var(--surface)),var(--accent-gradient);
    background-origin:border-box;background-clip:padding-box,border-box;
    box-shadow:0 -10px 40px rgba(0,0,0,.15);
  }
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .modal-head h3{font-size:18px;}

  ::-webkit-scrollbar{width:0;height:0;}
</style>
</head>
<body>

function findFood(query){
  const q = query.trim().toLowerCase();
  if(!q) return null;
  let exact = FOOD_DB.find(f=>f.name.toLowerCase()===q);
  if(exact) return exact;
  let starts = FOOD_DB.find(f=>f.name.toLowerCase().startsWith(q));
  if(starts) return starts;
  let contains = FOOD_DB.filter(f=> f.name.toLowerCase().includes(q) || q.split(/\s+/).every(w=>f.name.toLowerCase().includes(w)) );
  if(contains.length) return contains[0];
  return null;
}

function parseServingToGrams(text, food){
  const t = (text||'').trim().toLowerCase();
  if(!t) return food.servingG;
  const numMatch = t.match(/[\d.]+/);
  const num = numMatch ? parseFloat(numMatch[0]) : null;
  if(num===null) return food.servingG;
  if(t.includes('kg')) return num*1000;
  if(t.includes('g')) return num;
  if(t.includes('lb')) return num*453.592;
  if(t.includes('oz')) return num*28.3495;
  if(t.includes('cup')) return num*food.servingG;
  if(t.includes('serving')) return num*food.servingG;
  return num; // bare number assumed to be grams
}

function storageSelfTest(){

async function storageGet(key){
  if(hasCloudStorage){
    try{
      const r = await window.storage.get(key, false);
      return r ? r.value : null;
    }catch(e){ /* fall through to local */ }
  }
  try{ return localStorage.getItem(STORAGE_PREFIX+key); }
  catch(e){ return memoryStore[key] || null; }
}

async function storageSet(key, value){
  if(hasCloudStorage){
    try{ await window.storage.set(key, value, false); return; }catch(e){ /* fall through */ }
  }
  try{ localStorage.setItem(STORAGE_PREFIX+key, value); }
  catch(e){ memoryStore[key] = value; storageWorking = false; }
}

function computeStreak(){
  const days = new Set(state.sessions.map(w=>w.date));
  if(state.activeSession) days.add(state.activeSession.date);
  const frozen = new Set(state.profile.frozenDates||[]);
  const today = todayStr();
  let streak = 0;
  let d = new Date();
  if(!days.has(today) && !frozen.has(today)) d.setDate(d.getDate()-1);
  let usedNewFreeze = false;
  while(true){
    const key = d.toISOString().slice(0,10);
    if(days.has(key) || frozen.has(key)){
      streak++; d.setDate(d.getDate()-1);
    } else if((state.profile.streakFreezes||0) > 0 && key < today){
      frozen.add(key);
      state.profile.frozenDates = [...frozen];
      state.profile.streakFreezes -= 1;
      usedNewFreeze = true;
      streak++; d.setDate(d.getDate()-1);
    } else break;
  }
  const milestoneReached = Math.floor(streak/14);
  if(milestoneReached > (state.profile.streakMilestoneReached||0)){
    state.profile.streakFreezes = (state.profile.streakFreezes||0) + (milestoneReached - (state.profile.streakMilestoneReached||0));
    state.profile.streakMilestoneReached = milestoneReached;
    usedNewFreeze = true;
  }
  if(usedNewFreeze) saveProfile();
  return streak;
}

/* =========================================================
   MOMENTUM SCORE — a single, transparent score blending
   consistency, progressive overload, nutrition & hydration
========================================================= */
function computeMomentum(){
  const today = todayStr();
  const last14 = state.sessions.filter(s=> (new Date(today)-new Date(s.date))/86400000 <= 14);
  const split = getActiveSplit();
  const expectedWorkouts = split ? Math.max(2, Math.round(split.days*2)) : 6;
  const consistencyScore = clamp(last14.length/expectedWorkouts*100, 0, 100);

  let improving=0, trendTotal=0;
  const prNames = Object.keys(exercisePRs());
  prNames.forEach(name=>{
    const relevant = [...state.sessions].filter(s=>maxSetWeightForExercise(s,name)!==null).sort((a,b)=>a.startedAt-b.startedAt).slice(-2);
    if(relevant.length===2){
      trendTotal++;
      if(maxSetWeightForExercise(relevant[1],name) >= maxSetWeightForExercise(relevant[0],name)) improving++;
    }
  });
  const overloadScore = trendTotal>0 ? (improving/trendTotal*100) : 50;

  let goodDays=0, loggedDays=0;
  for(let i=0;i<7;i++){
    const d = new Date(); d.setDate(d.getDate()-i);
    const tot = nutritionTotals(d.toISOString().slice(0,10));
    if(tot.calories>0){
      loggedDays++;
      const pct = tot.calories/state.profile.targets.calories;
      if(pct>=0.85 && pct<=1.15) goodDays++;
    }
  }
  const nutritionScore = loggedDays>0 ? (goodDays/loggedDays*100) : 50;

  let waterGood=0, waterLogged=0;
  for(let i=0;i<7;i++){
    const d = new Date(); d.setDate(d.getDate()-i);
    const key = d.toISOString().slice(0,10);
    const w = state.water.find(x=>x.date===key);
    if(w){ waterLogged++; if(w.cups >= state.profile.waterTarget*0.8) waterGood++; }
  }
  const hydrationScore = waterLogged>0 ? (waterGood/waterLogged*100) : 50;

  const score = Math.round(consistencyScore*0.35 + overloadScore*0.25 + nutritionScore*0.25 + hydrationScore*0.15);
  let label = 'Just Getting Started';
  if(score>=85) label = 'Locked In';
  else if(score>=70) label = 'Strong Momentum';
  else if(score>=50) label = 'Building';
  else if(score>=30) label = 'Slipping';
  else label = 'Cooling Off';
  return { score: clamp(score,0,100), label, consistencyScore, overloadScore, nutritionScore, hydrationScore };
}

function pairedProteinPerformance(){
  const sessions = [...state.sessions].sort((a,b)=>a.startedAt-b.startedAt);
  const target = state.profile.targets.protein;
  const highGroup=[], lowGroup=[];
  sessions.forEach(s=>{
    const prevDate = new Date(s.date+'T00:00:00'); prevDate.setDate(prevDate.getDate()-1);
    const totals = nutritionTotals(prevDate.toISOString().slice(0,10));
    if(totals.calories===0) return;
    const pct = totals.protein/target;
    const vol = sessionStats(s).volume;
    if(pct>=0.9) highGroup.push(vol);
    else if(pct<0.7) lowGroup.push(vol);
  });
  if(highGroup.length<3 || lowGroup.length<3) return null;
  const avgHigh = highGroup.reduce((a,b)=>a+b,0)/highGroup.length;
  const avgLow = lowGroup.reduce((a,b)=>a+b,0)/lowGroup.length;
  if(avgLow<=0) return null;
  const diffPct = Math.round((avgHigh-avgLow)/avgLow*100);
  if(Math.abs(diffPct)<8) return null;
  return {diffPct, sample: highGroup.length+lowGroup.length};
}

function pairedRestGapPerformance(){
  const sessions = [...state.sessions].sort((a,b)=>a.startedAt-b.startedAt);
  const shortGap=[], longGap=[];
  for(let i=1;i<sessions.length;i++){
    const gapDays = Math.round((new Date(sessions[i].date) - new Date(sessions[i-1].date))/86400000);
    const vol = sessionStats(sessions[i]).volume;
    if(gapDays<=1) shortGap.push(vol);
    else if(gapDays>=2) longGap.push(vol);
  }
  if(shortGap.length<3 || longGap.length<3) return null;
  const avgShort = shortGap.reduce((a,b)=>a+b,0)/shortGap.length;
  const avgLong = longGap.reduce((a,b)=>a+b,0)/longGap.length;
  if(avgShort<=0) return null;
  const diffPct = Math.round((avgLong-avgShort)/avgShort*100);
  if(Math.abs(diffPct)<10) return null;
  return {diffPct, sample: shortGap.length+longGap.length};
}

function weekdayPattern(){
  const buckets = {};
  state.sessions.forEach(s=>{
    const day = new Date(s.date+'T00:00:00').getDay();
    buckets[day] = buckets[day] || [];
    buckets[day].push(sessionStats(s).volume);
  });
  const avgs = Object.entries(buckets)
    .filter(([d,arr])=>arr.length>=3)
    .map(([d,arr])=>({day:Number(d), avg:arr.reduce((a,b)=>a+b,0)/arr.length}));
  if(avgs.length<2) return null;
  avgs.sort((a,b)=>b.avg-a.avg);
  const best = avgs[0], worst = avgs[avgs.length-1];
  if(worst.avg<=0) return null;
  const diffPct = Math.round((best.avg-worst.avg)/worst.avg*100);
  if(diffPct<15) return null;
  const dayNames=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  return {bestDay:dayNames[best.day], worstDay:dayNames[worst.day], diffPct};
}

/* =========================================================
   FUTURE YOU — honest linear-regression projections from
   the user's own historical rate of progress, plus a
   "what if" recalculation using their own Discoveries data.
========================================================= */
function linearRegressionSlope(points){
  const n = points.length;
  if(n<2) return null;
  const sumX = points.reduce((s,p)=>s+p.x,0);
  const sumY = points.reduce((s,p)=>s+p.y,0);
  const sumXY = points.reduce((s,p)=>s+p.x*p.y,0);
  const sumXX = points.reduce((s,p)=>s+p.x*p.x,0);
  const denom = (n*sumXX - sumX*sumX);
  if(denom===0) return null;
  return (n*sumXY - sumX*sumY) / denom;
}

function nextMilestone(current){
  const step = state.profile.unit==='kg' ? 5 : 10;
  return Math.ceil((current+0.01)/step)*step;
}

function fmtProjDate(d){
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
}

function computeExerciseTrajectory(name){
  const sessions = [...state.sessions]
    .filter(s=>maxSetWeightForExercise(s,name)!==null)
    .sort((a,b)=>a.startedAt-b.startedAt);
  if(sessions.length<3) return null;
  const firstTime = sessions[0].startedAt;
  const points = sessions.map(s=>({ x:(s.startedAt-firstTime)/86400000, y:maxSetWeightForExercise(s,name) }));
  const slope = linearRegressionSlope(points);
  if(!slope || slope<=0.01) return null;
  const current = points[points.length-1].y;
  const milestone = nextMilestone(current);
  const daysToMilestone = (milestone-current)/slope;
  if(daysToMilestone<=0 || daysToMilestone>365) return null;
  const projDate = new Date(); projDate.setDate(projDate.getDate()+Math.round(daysToMilestone));
  return {name, current, milestone, slope, daysToMilestone: Math.round(daysToMilestone), projDate};
}

function computeWeightTrajectory(){
  const goal = state.profile.goalWeight;
  if(!goal) return null;
  const sorted = [...state.bodyWeights].sort((a,b)=>a.date.localeCompare(b.date));
  if(sorted.length<3) return null;
  const firstTime = new Date(sorted[0].date+'T00:00:00').getTime();
  const points = sorted.map(b=>({x:(new Date(b.date+'T00:00:00').getTime()-firstTime)/86400000, y:b.weight}));
  const slope = linearRegressionSlope(points);
  if(!slope) return null;
  const current = points[points.length-1].y;
  const direction = goal>current ? 1 : -1;
  if(Math.sign(slope)!==direction) return null;
  const daysToGoal = (goal-current)/slope;
  if(daysToGoal<=0 || daysToGoal>365) return null;
  const projDate = new Date(); projDate.setDate(projDate.getDate()+Math.round(daysToGoal));
  return {current, goal, daysToGoal:Math.round(daysToGoal), projDate};
}

function topTrajectoryExercises(){
  const prs = exercisePRs();
  const withCounts = Object.keys(prs).map(name=>({
    name, count: state.sessions.filter(s=>maxSetWeightForExercise(s,name)!==null).length
  })).filter(x=>x.count>=3).sort((a,b)=>b.count-a.count).slice(0,3);
  return withCounts.map(x=>computeExerciseTrajectory(x.name)).filter(Boolean);
}

function whatIfProteinTrajectory(traj){
  const pp = pairedProteinPerformance();
  if(!pp || pp.diffPct<=0) return null;
  const adjustedSlope = traj.slope * (1 + (pp.diffPct/100)*0.5);
  if(adjustedSlope<=traj.slope) return null;
  const daysToMilestone = (traj.milestone-traj.current)/adjustedSlope;
  if(daysToMilestone<=0) return null;
  const projDate = new Date(); projDate.setDate(projDate.getDate()+Math.round(daysToMilestone));
  return {daysToMilestone:Math.round(daysToMilestone), projDate};
}

function generateCoachNote(){
  const tw = rangeStats(0,7), lw = rangeStats(7,7);
  const streak = computeStreak();
  const momentum = computeMomentum();
  const discoveries = generateDiscoveries();
  const prs = exercisePRs();
  const weekStart = new Date(); weekStart.setDate(weekStart.getDate()-6);
  const weekStartStr = weekStart.toISOString().slice(0,10);
  const newPRs = Object.entries(prs).filter(([name,pr])=>pr.date>=weekStartStr);

  const lines = [];
  if(tw.count===0){
    lines.push("This week was quiet on the training front — no workouts logged.");
  } else {
    lines.push(`You trained ${tw.count} time${tw.count===1?'':'s'} this week, moving a total of ${Math.round(tw.volume).toLocaleString()} ${unitLabel()}.`);
    if(lw.count>0 && lw.volume>0){
      const deltaVol = Math.round((tw.volume-lw.volume)/lw.volume*100);
      if(deltaVol>=10) lines.push(`That's up ${deltaVol}% in volume from last week — real progress.`);
      else if(deltaVol<=-10) lines.push(`That's down ${Math.abs(deltaVol)}% from last week's volume — worth checking in on recovery or scheduling.`);
    }
  }
  if(newPRs.length>0){
    lines.push(`You hit ${newPRs.length} new PR${newPRs.length===1?'':'s'} this week: ${newPRs.map(([name])=>name).join(', ')}. 🏆`);
  }
  if(streak>=7) lines.push(`Your streak is at ${streak} days — that's a real habit forming.`);
  if(discoveries.length>0) lines.push(discoveries[0]);
  let closer;
  if(momentum.score>=85) closer = "You're locked in right now. Keep doing exactly what you're doing.";
  else if(momentum.score>=70) closer = "Strong momentum — a couple more consistent weeks and this becomes second nature.";
  else if(momentum.score>=50) closer = "You're building something here. Stay consistent and it compounds.";
  else if(momentum.score>=30) closer = "Momentum's slipping a bit — even a short session this week would help turn it around.";
  else closer = "It's been a tough stretch. Pick one small thing to do today — that's how comebacks start.";
  lines.push(closer);
  return lines;
}

function nutritionTotals(dateStr){

  return entries.reduce((acc,e)=>{
    acc.calories += Number(e.calories)||0;
    acc.protein += Number(e.protein)||0;
    acc.carbs += Number(e.carbs)||0;
    acc.fat += Number(e.fat)||0;
    return acc;
  },{calories:0,protein:0,carbs:0,fat:0});
}

function exercisePRs(){
  const map = {};
  state.sessions.forEach(session=>{
    (session.exercises||[]).forEach(ex=>{
      ex.sets.forEach(s=>{
        const wt = Number(s.weight)||0;
        if(!map[ex.name] || wt > map[ex.name].weight){
          map[ex.name] = {weight:wt, reps:s.reps, date:session.date};
        }
      });
    });
  });
  return map;
}

function estOneRM(weight, reps){
  if(!weight || !reps) return 0;
  return Math.round(weight * (1 + reps/30));
}

function maxSetWeightForExercise(session, name){
  let max = null;
  (session.exercises||[]).forEach(ex=>{
    if(ex.name!==name) return;
    ex.sets.forEach(s=>{
      const w = Number(s.weight)||0;
      if(max===null || w>max) max = w;
    });
  });
  return max;
}

function lastTimeForExercise(name){
  const past = [...state.sessions]
    .filter(s=> (s.exercises||[]).some(e=>e.name===name))
    .sort((a,b)=>b.startedAt-a.startedAt);
  if(past.length===0) return null;
  const ex = past[0].exercises.find(e=>e.name===name);
  return { date: past[0].date, sets: ex.sets };
}

/* =========================================================
   AUTO-REGULATING PRESCRIPTION ENGINE
   Turns logged history + today's readiness into concrete
   working sets. This is what separates a tracker from a coach.
========================================================= */
function roundToPlate(weight){
  const inc = state.profile.unit==='kg' ? 2.5 : 5;
  return Math.max(inc, Math.round(weight/inc)*inc);
}

function historyForExercise(name, limit){
  return [...state.sessions]
    .filter(s=> (s.exercises||[]).some(e=>e.name===name && e.sets.length>0))
    .sort((a,b)=>b.startedAt-a.startedAt)
    .slice(0, limit||5)
    .map(s=>{
      const ex = s.exercises.find(e=>e.name===name);
      const top = ex.sets.reduce((best,x)=> (Number(x.weight)||0)>(Number(best.weight)||0) ? x : best, ex.sets[0]);
      const rpes = ex.sets.map(x=>x.rpe).filter(x=>x!=null);
      return {
        date: s.date,
        topWeight: Number(top.weight)||0,
        topReps: Number(top.reps)||0,
        setCount: ex.sets.length,
        avgRpe: rpes.length ? rpes.reduce((a,b)=>a+b,0)/rpes.length : null
      };
    });
}

function readinessMultiplier(){
  const sess = state.activeSession;
  if(!sess) return {mult:1, reason:null};
  if(sess.comeback) return {mult:0.85, reason:'Comeback Mode — easing back in'};
  const r = sess.readiness;
  if(!r || (!r.energy && !r.sleep)) return {mult:1, reason:null};
  const vals = [r.energy, r.sleep].filter(v=>v!=null);
  const avg = vals.reduce((a,b)=>a+b,0)/vals.length;
  if(avg <= 2) return {mult:0.92, reason:'Low readiness — pulled back slightly'};
  if(avg >= 4.5) return {mult:1.03, reason:'High readiness — pushing a little'};
  return {mult:1, reason:null};
}

function prescribeExercise(name){
  const hist = historyForExercise(name, 5);
  if(hist.length === 0){
    return {
      name, isNew:true,
      note:"First time logging this — start conservative and find a weight you can control for 8-10 clean reps.",
      sets:null
    };
  }

  const last = hist[0];
  const inc = state.profile.unit==='kg' ? 2.5 : 5;
  let targetWeight = last.topWeight;
  let targetReps = last.topReps;
  let rationale = '';

  // Detect stall: last 3 sessions with no top-weight increase
  const stalled = hist.length >= 3 &&
    hist[0].topWeight <= hist[1].topWeight &&
    hist[1].topWeight <= hist[2].topWeight;

  if(stalled){
    targetWeight = roundToPlate(last.topWeight * 0.9);
    targetReps = Math.max(5, last.topReps);
    rationale = "Stalled 3 sessions — deload ~10% this week, then build back with better bar speed.";
  } else if(last.avgRpe != null && last.avgRpe <= 7){
    targetWeight = last.topWeight + inc;
    rationale = `Last time averaged RPE ${last.avgRpe.toFixed(1)} — you had more in the tank, so add ${inc}${unitLabel()}.`;
  } else if(last.avgRpe != null && last.avgRpe >= 9.5){
    targetReps = Math.max(3, last.topReps - 1);
    rationale = `Last time averaged RPE ${last.avgRpe.toFixed(1)} — that was near max, so hold the weight and consolidate.`;
  } else if(last.topReps >= 10){
    targetWeight = last.topWeight + inc;
    targetReps = Math.max(6, last.topReps - 3);
    rationale = `You hit ${last.topReps} reps — time to add ${inc}${unitLabel()} and drop back down the rep range.`;
  } else {
    targetReps = last.topReps + 1;
    rationale = `Same weight, one more rep than last time (${last.topWeight}${unitLabel()}×${last.topReps}).`;
  }

  const rm = readinessMultiplier();
  if(rm.mult !== 1){
    targetWeight = roundToPlate(targetWeight * rm.mult);
  }
  targetWeight = roundToPlate(targetWeight);

  const setCount = Math.max(3, Math.min(5, last.setCount || 3));
  const warmups = [];
  if(targetWeight > inc*4){
    warmups.push({weight: roundToPlate(targetWeight*0.5), reps: 8, warmup:true});
    warmups.push({weight: roundToPlate(targetWeight*0.75), reps: 5, warmup:true});
  }
  const working = Array.from({length:setCount}, ()=>({weight:targetWeight, reps:targetReps, warmup:false}));

  return {
    name, isNew:false,
    sets: [...warmups, ...working],
    targetWeight, targetReps, setCount,
    rationale,
    readinessNote: rm.reason,
    lastSummary: `${last.topWeight}${unitLabel()}×${last.topReps} on ${fmtDate(last.date)}`
  };
}

function rangeStats(startOffsetDaysAgo, days){
  const end = new Date(); end.setDate(end.getDate()-startOffsetDaysAgo);
  const start = new Date(end); start.setDate(start.getDate()-(days-1));
  const startStr = start.toISOString().slice(0,10), endStr = end.toISOString().slice(0,10);
  const sessions = state.sessions.filter(s=> s.date>=startStr && s.date<=endStr);
  const volume = sessions.reduce((sum,s)=>sum+sessionStats(s).volume,0);
  return {volume, count:sessions.length};
}

const RANKS = [
  {name:'Rookie', icon:'🌱', xp:0},
  {name:'Bronze', icon:'🥉', xp:500},
  {name:'Silver', icon:'🥈', xp:1500},
  {name:'Gold', icon:'🥇', xp:3500},
  {name:'Platinum', icon:'💎', xp:7000},
  {name:'Diamond', icon:'👑', xp:15000},
  {name:'Elite', icon:'🏆', xp:30000}
];

function computeXP(){
  const totalVolume = state.sessions.reduce((sum,s)=>sum+sessionStats(s).volume,0);
  const totalWorkouts = state.sessions.length;
  const streak = computeStreak();
  return Math.round(totalVolume/50 + totalWorkouts*40 + streak*15);
}

function computeRank(){
  const xp = computeXP();
  let current = RANKS[0], next = null;
  for(let i=0;i<RANKS.length;i++){
    if(xp >= RANKS[i].xp){ current = RANKS[i]; next = RANKS[i+1] || null; }
  }
  return {xp, current, next};
}

function computeAchievements(){
  const totalWorkouts = state.sessions.length;
  const totalVolume = state.sessions.reduce((sum,s)=>sum+sessionStats(s).volume,0);
  const streak = computeStreak();
  function highestEarned(list,val){ let earned=null; list.forEach(t=>{ if(val>=t.n) earned=t; }); return earned; }
  function nextGoal(list,val){ return list.find(t=>val<t.n) || null; }
  const earned=[];
  const w=highestEarned(ACHIEVEMENT_TIERS.workouts,totalWorkouts); if(w) earned.push(w.label);
  const v=highestEarned(ACHIEVEMENT_TIERS.volume,totalVolume); if(v) earned.push(v.label);
  const s=highestEarned(ACHIEVEMENT_TIERS.streak,streak); if(s) earned.push(s.label);
  const candidates=[];
  const nw=nextGoal(ACHIEVEMENT_TIERS.workouts,totalWorkouts); if(nw) candidates.push({label:nw.label, cur:totalWorkouts, target:nw.n});
  const nv=nextGoal(ACHIEVEMENT_TIERS.volume,totalVolume); if(nv) candidates.push({label:nv.label, cur:Math.round(totalVolume), target:nv.n});
  const ns=nextGoal(ACHIEVEMENT_TIERS.streak,streak); if(ns) candidates.push({label:ns.label, cur:streak, target:ns.n});
  candidates.sort((a,b)=> (b.cur/b.target) - (a.cur/a.target));
  return {earned, next: candidates[0]||null};
}

function setWaterCups(n){

function logBodyWeight(w){

}
function latestBodyWeight(){

  return sorted.length ? sorted[sorted.length-1] : null;
}

function computeSuggestedPhysique(){
  const cur = latestBodyWeight();
  const goal = state.profile.goalWeight;
  if(!cur || !goal) return null;
  const pct = (goal - cur.weight) / cur.weight;
  if(pct <= -0.05) return 'shred';
  if(pct < -0.015) return 'lean';
  if(pct >= 0.05) return 'mass';
  if(pct > 0.015) return 'lean-bulk';
  return 'recomp';
}

function computePlates(target, barWeight, unit){
  const plates = unit==='kg' ? [20,15,10,5,2.5,1.25] : [45,35,25,10,5,2.5];
  let perSide = (target - barWeight) / 2;
  if(perSide <= 0) return {list:[], remainder:0};
  const list = [];
  let remaining = perSide;
  plates.forEach(p=>{
    const count = Math.floor(remaining/p + 1e-6);
    if(count>0){ list.push({plate:p, count}); remaining -= count*p; }
  });
  return {list, remainder: Math.round(remaining*100)/100};
}

function allSplits(){

}
function getActiveSplit(){

function svgLineChart(points){
  const w = 300, h = 110, pad = 8;
  if(points.length === 0) return `<div class="empty">Not enough data yet.</div>`;
  if(points.length === 1) points = [points[0], points[0]];
  const vals = points.map(p=>p.y);
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max-min) || 1;
  const stepX = (w-pad*2)/(points.length-1);
  const coords = points.map((p,i)=>{
    const x = pad + i*stepX;
    const y = h-pad - ((p.y-min)/range)*(h-pad*2);
    return [x,y];
  });
  const path = coords.map((c,i)=> (i===0?'M':'L')+c[0].toFixed(1)+' '+c[1].toFixed(1)).join(' ');
  const dots = coords.map(c=>`<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3" fill="var(--blue)"/>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:110px;overflow:visible;">
    <path d="${path}" fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
  </svg>`;
}

function svgBarChart(points, targetLine){
  const w = 300, h = 110, pad = 6, gap = 6;
  const barW = (w - pad*2 - gap*(points.length-1)) / points.length;
  const max = Math.max(targetLine||0, ...points.map(p=>p.y), 1);
  const bars = points.map((p,i)=>{
    const x = pad + i*(barW+gap);
    const bh = (p.y/max) * (h-pad*2-14);
    const y = h-pad-14 - bh;
    const color = targetLine && p.y > targetLine*1.1 ? '#F59E0B' : (targetLine && p.y >= targetLine*0.85 ? 'var(--blue)' : 'var(--surface-3)');
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${bh.toFixed(1)}" rx="2" fill="${color}" stroke="var(--line-strong)"/>
      <text x="${(x+barW/2).toFixed(1)}" y="${h-2}" font-size="8" fill="var(--dim)" text-anchor="middle">${p.label}</text>`;
  }).join('');
  let target = '';
  if(targetLine){
    const ty = h-pad-14 - (targetLine/max)*(h-pad*2-14);
    target = `<line x1="${pad}" y1="${ty.toFixed(1)}" x2="${w-pad}" y2="${ty.toFixed(1)}" stroke="var(--dim)" stroke-width="1" stroke-dasharray="3,3"/>`;
  }
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:110px;">${target}${bars}</svg>`;
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const BOSS_BATTLES = [
  {id:'bw-bench', exercise:'Barbell Bench Press', multiplier:1.0, label:'Bodyweight Bench', icon:'👹'},
  {id:'bw-squat', exercise:'Back Squat', multiplier:1.5, label:'1.5x Bodyweight Squat', icon:'🐉'},
  {id:'bw-deadlift', exercise:'Deadlift', multiplier:2.0, label:'2x Bodyweight Deadlift', icon:'👑'},
  {id:'bw-ohp', exercise:'Overhead Press', multiplier:0.75, label:'0.75x Bodyweight OHP', icon:'⚡'}
];

function computeBossBattles(){
  const bw = latestBodyWeight();
  if(!bw) return {defeated:[], next:null};
  const prs = exercisePRs();
  const defeated = [];
  const candidates = [];
  BOSS_BATTLES.forEach(b=>{
    const pr = prs[b.exercise];
    const target = Math.round(bw.weight*b.multiplier);
    if(pr && pr.weight >= target){
      defeated.push(b);
    } else if(pr) {
      candidates.push({...b, cur: pr.weight, target});
    }
  });
  candidates.sort((a,b)=> (b.cur/b.target)-(a.cur/a.target));
  return {defeated, next: candidates[0]||null};
}

function renderBossBattlesCard(){
  const bb = computeBossBattles();
  if(bb.defeated.length===0 && !bb.next) return '';
  return `
    <div class="card">
      <div class="section-title">Boss Battles</div>
      ${bb.defeated.length ? `<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:${bb.next?'12px':'0'};">${bb.defeated.map(b=>`<span class="badge">${b.icon} ${escapeHtml(b.label)} — Defeated</span>`).join('')}</div>` : ''}

        <div class="bar light"><i style="width:${clamp(bb.next.cur/bb.next.target*100,0,100)}%"></i></div>
      ` : ''}
    </div>
  `;
}

let restTotal = 0, restRemaining = 0, restRunning = false, restIntervalHandle = null;

function stopSessionTimer(){

}

function resetRestVars(){
  restRunning = false;
  if(restIntervalHandle){ clearInterval(restIntervalHandle); restIntervalHandle = null; }
  restTotal = 0; restRemaining = 0;
}

function playBeep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime+0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.35);
    osc.start(); osc.stop(ctx.currentTime+0.4);
  }catch(e){}
}

function startRest(seconds){
  restTotal = seconds; restRemaining = seconds; restRunning = true;
  if(restIntervalHandle) clearInterval(restIntervalHandle);
  restIntervalHandle = setInterval(restTick, 1000);
  if(state.activeSession) renderActiveWorkout();
}
function restTick(){
  if(!restRunning) return;
  restRemaining--;
  if(restRemaining<=0){
    restRemaining = 0; restRunning = false;
    clearInterval(restIntervalHandle); restIntervalHandle = null;
    playBeep();
    if(state.activeSession) renderActiveWorkout();
    return;
  }
  updateRestDisplay();
}
function updateRestDisplay(){
  const txt = document.getElementById('restTimerText');
  if(txt) txt.textContent = fmtDuration(restRemaining*1000);
  const bar = document.getElementById('restBar');
  if(bar && restTotal>0) bar.style.width = clamp((restTotal-restRemaining)/restTotal*100,0,100)+'%';
}
function pauseRest(){ restRunning = false; renderActiveWorkout(); }
function resumeRest(){
  if(restRemaining>0){
    restRunning = true;
    if(restIntervalHandle) clearInterval(restIntervalHandle);
    restIntervalHandle = setInterval(restTick, 1000);
  }
  renderActiveWorkout();
}
function resetRest(){ resetRestVars(); renderActiveWorkout(); }

function renderLifts(){

}

function muscleGroupVolumes(days){
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-(days||28));
  const cutoffStr = cutoff.toISOString().slice(0,10);
  const totals = {};
  Object.keys(EXERCISES).forEach(g=>{ totals[g]=0; });
  state.sessions.filter(s=>s.date>=cutoffStr).forEach(s=>{
    s.exercises.forEach(ex=>{
      const group = Object.keys(EXERCISES).find(g=>EXERCISES[g].includes(ex.name));
      if(!group) return;
      totals[group] += ex.sets.reduce((v,x)=>v+(Number(x.weight)||0)*(Number(x.reps)||0),0);
    });
  });
  return totals;
}

  const totals = muscleGroupVolumes(28);

}

function computeSeasonStats(){
  if(!state.profile.seasonStart) return null;
  const start = state.profile.seasonStart;
  const sessions = state.sessions.filter(s=>s.date>=start);
  const volume = sessions.reduce((sum,s)=>sum+sessionStats(s).volume,0);
  const daysElapsed = Math.max(0, Math.floor((new Date(todayStr())-new Date(start))/86400000));
  const totalDays = state.profile.seasonLength*7;
  const weekNum = Math.min(state.profile.seasonLength, Math.floor(daysElapsed/7)+1);
  const isComplete = daysElapsed >= totalDays;
  const prs = exercisePRs();
  const seasonPRs = Object.values(prs).filter(pr=>pr.date>=start).length;
  return {start, sessions: sessions.length, volume, weekNum, totalWeeks: state.profile.seasonLength, daysElapsed, totalDays, isComplete, seasonPRs};
}

function startSeason(weeks){
  state.profile.seasonStart = todayStr();

}

function volumeComparison(volume, unit){
  const lbs = unit==='kg' ? volume*2.20462 : volume;
  const cars = lbs/4000;
  if(cars>=1) return `That's about ${cars.toFixed(1)} cars' worth of weight moved.`;
  const bowlingBalls = Math.round(lbs/14);
  return bowlingBalls>0 ? `That's about ${bowlingBalls} bowling balls' worth of weight moved.` : '';
}

      <div style="font-size:13.5px;color:var(--dim);margin-bottom:12px;">Start a workout to track every exercise, set, and rep — plus total weight lifted and time under the bar.</div>
      <div class="row">
        <button class="btn btn-primary" id="btnStartWorkout">▶ Start Workout</button>
        ${sortedSessions.length ? `<button class="btn btn-ghost" id="btnRepeatWorkout">🔁 Repeat Last</button>` : ''}
      </div>
    </div>

    ${renderSeasonCard()}
    ${state.sessions.length ? renderWeekCompareCard() : ''}
    ${renderMuscleBalanceCard()}
    ${prRows.length ? renderPerformanceCard(prRows) : ''}

    <div class="section-title" style="margin-top:4px;">Workout History</div>
    ${sortedSessions.length===0 ? `<div class="empty">No workouts logged yet. Start your first one above 💪</div>` :
      sortedSessions.map(s=>{
        const st = sessionStats(s);
        const dur = s.endedAt ? fmtDuration(s.endedAt - s.startedAt) : '—';
        return `
        <div class="card session-summary-card" data-session="${s.id}">
          <div class="ss-head">
            <div>
              <div class="ss-date">${fmtDate(s.date)}</div>
              <div class="ss-meta">${s.exercises.length} exercise${s.exercises.length===1?'':'s'} · ${dur}</div>
            </div>
            <button class="icon-btn" data-delsession="${s.id}"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6"/></svg></button>
          </div>
          <div class="ss-stats">
            <span><b>${Math.round(st.volume).toLocaleString()}</b> ${unitLabel()} volume</span>
            <span><b>${st.sets}</b> sets</span>
            <span><b>${st.reps}</b> reps</span>
          </div>
          ${expandedSession===s.id ? `
            <div class="session-detail">
              ${s.exercises.map(ex=>`
                <div class="exercise-log">
                  <div class="exname">${escapeHtml(ex.name)}</div>
                  <div class="sets">${ex.sets.map(st2=>`${st2.weight}${unitLabel()}×${st2.reps}`).join('  ·  ')}</div>
                </div>
              `).join('')}
            </div>
          ` : ''}
        </div>`;
      }).join('')
    }
  `;

  document.getElementById('btnStartWorkout').onclick = startWorkout;
  const repeatBtn = document.getElementById('btnRepeatWorkout');
  if(repeatBtn) repeatBtn.onclick = ()=> repeatLastWorkout(sortedSessions[0]);
  const startSeasonBtn = document.getElementById('btnStartSeason');
  if(startSeasonBtn) startSeasonBtn.onclick = ()=>{ startSeason(8); renderWorkoutHome(); };
  const endSeasonBtn = document.getElementById('btnEndSeason');
  if(endSeasonBtn) endSeasonBtn.onclick = ()=>{
    const s = computeSeasonStats();
    if(s && s.isComplete) openSeasonSummary(); else endSeasonEarly();
  };
  document.querySelectorAll('.session-summary-card').forEach(card=>{
    card.addEventListener('click', e=>{
      if(e.target.closest('[data-delsession]')) return;
      const id = card.dataset.session;
      expandedSession = expandedSession===id ? null : id;
      renderWorkoutHome();
    });
  });
  document.querySelectorAll('[data-delsession]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      state.sessions = state.sessions.filter(s=>s.id!==btn.dataset.delsession);
      saveSessions(); renderWorkoutHome();
    };
  });
  const sel = document.getElementById('chartExerciseSelect');
  if(sel) sel.onchange = e=>{ chartExercise = e.target.value; renderWorkoutHome(); };
}

function startWorkout(){
  state.activeSession = {
    id: uid(), date: todayStr(), startedAt: Date.now(), endedAt: null, exercises: [], readiness: null, comeback: false
  };
  resetRestVars();
  saveActiveSession();
  openReadinessCheckin();
}

function repeatLastWorkout(lastSession){
  if(!lastSession) return;
  state.activeSession = {
    id: uid(), date: todayStr(), startedAt: Date.now(), endedAt: null,
    exercises: lastSession.exercises.map(ex=>({ id: uid(), name: ex.name, sets: [] })),
    readiness: null, comeback: false
  };
  resetRestVars();
  saveActiveSession();
  openReadinessCheckin();
}

function startPlannedWorkout(day){
  if(!day) return;
  state.activeSession = {
    id: uid(), date: todayStr(), startedAt: Date.now(), endedAt: null,
    exercises: day.lifts.map(name=>({ id: uid(), name, sets: [] })),
    readiness: null, comeback: false
  };
  resetRestVars();
  saveActiveSession();
  openReadinessCheckin();
}

function openReadinessCheckin(){
  const lastSession = [...state.sessions].sort((a,b)=>b.startedAt-a.startedAt)[0];
  const daysSince = lastSession ? Math.round((new Date(todayStr())-new Date(lastSession.date))/86400000) : null;
  const comeback = daysSince!==null && daysSince>=14;
  openModal(`
    <div class="modal-head"><h3>Quick Check-In</h3></div>
    ${comeback ? `<div style="background:var(--blue-dim);padding:10px;border-radius:8px;margin-bottom:14px;color:var(--ink);font-size:13px;">🔄 It's been ${daysSince} days since your last workout — Comeback Mode is on. Suggested weights will be scaled down so you ease back in safely.</div>` : ''}
    <div class="field"><label>Energy Level (1-5)</label>
      <div class="row" id="energyRow">
        ${[1,2,3,4,5].map(n=>`<button type="button" class="btn btn-ghost btn-sm" data-energy="${n}">${n}</button>`).join('')}
      </div>
    </div>
    <div class="field"><label>Sleep Quality (1-5)</label>
      <div class="row" id="sleepRow">
        ${[1,2,3,4,5].map(n=>`<button type="button" class="btn btn-ghost btn-sm" data-sleep="${n}">${n}</button>`).join('')}
      </div>
    </div>
    <button class="btn btn-primary btn-block" id="btnSkipReadiness" style="margin-top:6px;">Continue to Workout</button>
  `);
  let chosenEnergy=null, chosenSleep=null;
  document.querySelectorAll('[data-energy]').forEach(btn=>{
    btn.onclick = ()=>{
      chosenEnergy = Number(btn.dataset.energy);
      document.querySelectorAll('[data-energy]').forEach(b=>{ b.style.background=''; b.style.color=''; });
      btn.style.background = 'var(--accent)'; btn.style.color = '#fff';
    };
  });
  document.querySelectorAll('[data-sleep]').forEach(btn=>{
    btn.onclick = ()=>{
      chosenSleep = Number(btn.dataset.sleep);
      document.querySelectorAll('[data-sleep]').forEach(b=>{ b.style.background=''; b.style.color=''; });
      btn.style.background = 'var(--accent)'; btn.style.color = '#fff';
    };
  });
  document.getElementById('btnSkipReadiness').onclick = ()=>{
    if(state.activeSession){
      state.activeSession.readiness = (chosenEnergy||chosenSleep) ? {energy:chosenEnergy, sleep:chosenSleep} : null;
      state.activeSession.comeback = comeback;
      saveActiveSession();
    }
    closeModal();
    if(state.activeSession && state.activeSession.exercises.length > 0){
      openGamePlan();
    } else {
      renderLifts();
    }
  };
}

function openGamePlan(){
  const sess = state.activeSession;
  if(!sess) return;
  const plans = sess.exercises.map(ex=>({ ex, rx: prescribeExercise(ex.name) }));
  const totalVolume = plans.reduce((sum,p)=>{
    if(!p.rx.sets) return sum;
    return sum + p.rx.sets.filter(s=>!s.warmup).reduce((v,s)=>v+s.weight*s.reps,0);
  },0);
  const rm = readinessMultiplier();

  openModal(`
    <div class="modal-head"><h3>🎯 Today's Game Plan</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
    ${rm.reason ? `<div style="background:var(--blue-dim);border:1px solid var(--blue-line);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:14px;font-size:12.5px;color:var(--ink);">⚡ ${escapeHtml(rm.reason)}</div>` : ''}
    ${plans.map(p=>`
      <div style="padding:10px 0;border-bottom:1px solid var(--line);">
        <div style="font-weight:700;font-size:13.5px;margin-bottom:4px;">${escapeHtml(p.ex.name)}</div>
        ${p.rx.isNew
          ? `<div style="font-size:12px;color:var(--dim);">${escapeHtml(p.rx.note)}</div>`
          : `<div style="font-size:12.5px;color:var(--accent);font-weight:700;">${p.rx.setCount} × ${p.rx.targetWeight}${unitLabel()} × ${p.rx.targetReps}</div>
             <div style="font-size:11px;color:var(--dim);margin-top:3px;">${escapeHtml(p.rx.rationale)}</div>`
        }
      </div>
    `).join('')}
    ${totalVolume>0 ? `<div style="text-align:center;margin-top:14px;font-size:12.5px;color:var(--dim);">Target volume today: <b style="color:var(--ink);">${Math.round(totalVolume).toLocaleString()} ${unitLabel()}</b></div>` : ''}
    <button class="btn btn-primary btn-block" id="btnBeginSession" style="margin-top:16px;">Let's Work</button>
  `);
  document.getElementById('btnBeginSession').onclick = ()=>{ closeModal(); renderLifts(); };
}

        <button class="btn btn-ghost btn-sm" data-rest="60">60s</button>
        <button class="btn btn-ghost btn-sm" data-rest="90">90s</button>
        <button class="btn btn-ghost btn-sm" data-rest="120">120s</button>
      </div>
    `;
  }
  const pct = clamp((restTotal-restRemaining)/restTotal*100,0,100);
  return `
    <div class="section-title">Rest Timer</div>
    <div class="rest-display" id="restTimerText">${fmtDuration(restRemaining*1000)}</div>
    <div class="bar light" style="margin:10px 0;"><i id="restBar" style="width:${pct}%"></i></div>
    <div class="row">
      ${restRunning ? `<button class="btn btn-ghost btn-sm" id="btnPauseRest">Pause</button>` : `<button class="btn btn-ghost btn-sm" id="btnResumeRest">Resume</button>`}

function suggestNextTarget(lt){
  if(!lt || !lt.sets.length) return null;
  const top = lt.sets.reduce((best,s)=> (Number(s.weight)||0) > (Number(best.weight)||0) ? s : best, lt.sets[0]);
  const w = Number(top.weight)||0, r = Number(top.reps)||0;
  if(!w) return null;
  if(state.activeSession && state.activeSession.comeback){
    const scaled = Math.round((w*0.85)/2.5)*2.5;
    return `${scaled}${unitLabel()} × ${r} (comeback pace)`;
  }
  const jump = state.profile.unit==='kg' ? 2.5 : 5;
  if(r >= 10) return `${(w+jump)}${unitLabel()} × ${r}`;
  return `${w}${unitLabel()} × ${r+1}`;
}

function renderSessionExerciseCard(ex){
  const rx = prescribeExercise(ex.name);
  const loggedCount = ex.sets.length;
  return `
    <div class="session-exercise" data-exid="${ex.id}">
      <div class="se-head">
        <div class="se-name">${escapeHtml(ex.name)}</div>
        <button class="icon-btn" data-removeex="${ex.id}"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0l-1 14a2 2 0 01-2 2H7a2 2 0 01-2-2L4 6"/></svg></button>
      </div>

      ${rx.isNew ? `
        <div class="rx-box">
          <div class="rx-label">Coach's Note</div>
          <div class="rx-why">${escapeHtml(rx.note)}</div>
        </div>
      ` : `
        <div class="rx-box">
          <div class="rx-label">Today's Prescription</div>
          <div class="rx-sets">
            ${rx.sets.map((s,i)=>{
              const done = i < loggedCount;
              return `<span class="rx-set ${s.warmup?'warmup':''} ${done?'done':''}" data-rxfill="${ex.id}" data-rxw="${s.weight}" data-rxr="${s.reps}">${done?'✓ ':''}${s.weight}${unitLabel()}×${s.reps}${s.warmup?' <em>warmup</em>':''}</span>`;
            }).join('')}
          </div>
          <div class="rx-why">${escapeHtml(rx.rationale)}</div>
          ${rx.readinessNote ? `<div class="rx-readiness">⚡ ${escapeHtml(rx.readinessNote)}</div>` : ''}
          <div class="rx-last">Last: ${escapeHtml(rx.lastSummary)}</div>
        </div>
      `}

      <div class="set-chip-row">
        ${ex.sets.length===0 ? `<span style="font-size:12px;color:var(--dim);">Tap a prescribed set above to log it, or enter your own below</span>` :
          ex.sets.map((s,i)=>`<span class="set-chip">${s.weight}${unitLabel()}×${s.reps}${s.rpe?` @${s.rpe}`:''}<button data-exid="${ex.id}" data-setidx="${i}" data-removeset>✕</button></span>`).join('')
        }
      </div>
      <div class="add-set-row" style="grid-template-columns:1fr 1fr 1fr auto;">
        <input type="number" inputmode="decimal" placeholder="Weight" data-exid="${ex.id}" data-newweight>
        <input type="number" inputmode="numeric" placeholder="Reps" data-exid="${ex.id}" data-newreps>
        <input type="number" inputmode="numeric" placeholder="RPE" min="1" max="10" data-exid="${ex.id}" data-newrpe>
        <button class="btn btn-sm btn-primary" data-exid="${ex.id}" data-addset>Add</button>
      </div>
    </div>
  `;
}

function bindSessionExerciseEvents(){
  const session = state.activeSession;
  document.querySelectorAll('[data-removeex]').forEach(btn=>{
    btn.onclick = ()=>{
      session.exercises = session.exercises.filter(e=>e.id!==btn.dataset.removeex);
      saveActiveSession(); renderActiveWorkout();
    };
  });
  document.querySelectorAll('[data-addset]').forEach(btn=>{
    btn.onclick = ()=>{
      const exid = btn.dataset.exid;
      const wInput = document.querySelector(`[data-newweight][data-exid="${exid}"]`);
      const rInput = document.querySelector(`[data-newreps][data-exid="${exid}"]`);
      const rpeInput = document.querySelector(`[data-newrpe][data-exid="${exid}"]`);
      const weight = wInput.value, reps = rInput.value;
      if(weight==='' || reps===''){ flashInvalid(null, wInput); return; }
      const ex = session.exercises.find(e=>e.id===exid);
      const rpeVal = rpeInput && rpeInput.value!=='' ? clamp(Number(rpeInput.value),1,10) : null;
      ex.sets.push({weight:Number(weight), reps:Number(reps), rpe:rpeVal});
      saveActiveSession();
      renderActiveWorkout();
    };
  });
  document.querySelectorAll('[data-removeset]').forEach(btn=>{
    btn.onclick = ()=>{
      const ex = session.exercises.find(e=>e.id===btn.dataset.exid);
      ex.sets.splice(Number(btn.dataset.setidx),1);
      saveActiveSession(); renderActiveWorkout();
    };
  });
  document.querySelectorAll('[data-rxfill]').forEach(chip=>{
    chip.onclick = ()=>{
      const ex = session.exercises.find(e=>e.id===chip.dataset.rxfill);
      if(!ex) return;
      ex.sets.push({weight:Number(chip.dataset.rxw), reps:Number(chip.dataset.rxr), rpe:null});
      saveActiveSession();
      renderActiveWorkout();
    };
  });
}

function startSessionTimer(){
  stopSessionTimer();
  const tick = ()=>{
    const el = document.getElementById('liveTimer');
    if(!el || !state.activeSession) return;
    el.textContent = fmtDuration(Date.now() - state.activeSession.startedAt);
  };
  tick();
  sessionTimerHandle = setInterval(tick, 1000);
}

function finishWorkout(){
  const session = state.activeSession;
  session.exercises = session.exercises.filter(ex=>ex.sets.length>0);
  if(session.exercises.length===0){
    cancelWorkout();
    return;
  }
  session.endedAt = Date.now();
  state.sessions.push(session);
  state.activeSession = null;
  stopSessionTimer();
  resetRestVars();
  saveSessions();
  saveActiveSession();
  renderLifts();
  renderHome();
  openPostWorkoutModal(session);
}

function openPostWorkoutModal(session){
  const feelOptions = [
    {v:1,e:'😩'},{v:2,e:'😕'},{v:3,e:'😐'},{v:4,e:'🙂'},{v:5,e:'💪'}

    <div class="field"><label>How'd that feel?</label>
      <div class="row" id="feelRow">

      </div>
    </div>
    <div class="field"><label>Quick note (optional)</label><input id="journalNote" placeholder="e.g. Felt strong on bench today"></div>
    <div class="divider"></div>
    <div class="field"><label>When's your next session?</label>
      <div class="row">
        <button class="btn btn-ghost btn-sm" data-plan="1">Tomorrow</button>
        <button class="btn btn-ghost btn-sm" data-plan="2">In 2 days</button>
        <button class="btn btn-ghost btn-sm" data-plan="3">In 3 days</button>
      </div>
    </div>
    <button class="btn btn-primary btn-block" id="btnSavePostWorkout" style="margin-top:6px;">Done</button>
  `);
  let chosenFeel = null, chosenPlanDays = null;
  document.querySelectorAll('[data-feel]').forEach(btn=>{
    btn.onclick = ()=>{
      chosenFeel = Number(btn.dataset.feel);
      document.querySelectorAll('[data-feel]').forEach(b=>{ b.style.background=''; b.style.color=''; });
      btn.style.background = 'var(--accent)'; btn.style.color = '#fff';
    };
  });
  document.querySelectorAll('[data-plan]').forEach(btn=>{
    btn.onclick = ()=>{
      chosenPlanDays = Number(btn.dataset.plan);
      document.querySelectorAll('[data-plan]').forEach(b=>{ b.style.background=''; b.style.color=''; });
      btn.style.background = 'var(--accent)'; btn.style.color = '#fff';
    };
  });
  document.getElementById('btnSavePostWorkout').onclick = ()=>{
    const note = document.getElementById('journalNote').value.trim();
    if(chosenFeel || note){
      state.journal.push({ id:uid(), sessionId:session.id, date:session.date, feel:chosenFeel, note });
      saveJournal();
    }
    if(chosenPlanDays){
      const d = new Date(); d.setDate(d.getDate()+chosenPlanDays);
      state.profile.plannedNextWorkout = d.toISOString().slice(0,10);
      saveProfile();
    }
    closeModal();
    renderHome();
  };
}

function cancelWorkout(){
  openModal(`
    <div class="modal-head"><h3>Cancel Workout?</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <div style="font-size:14px;color:var(--dim);margin-bottom:16px;">This will discard everything logged in this session. It won't be saved to your history.</div>
    <div class="row">
      <button class="btn btn-ghost" id="btnKeepGoing">Keep Going</button>
      <button class="btn btn-danger" id="btnConfirmCancel">Discard Workout</button>
    </div>
  `);
  document.getElementById('btnKeepGoing').onclick = closeModal;
  document.getElementById('btnConfirmCancel').onclick = ()=>{
    state.activeSession = null;
    stopSessionTimer();
    resetRestVars();
    saveActiveSession();
    closeModal();
    renderLifts(); renderHome();
  };
}

function flashInvalid(id, elDirect){
  const el = elDirect || document.getElementById(id);

function usdaGetNutrient(foodNutrients, nutrientNumber){
  if(!Array.isArray(foodNutrients)) return 0;
  const n = foodNutrients.find(x=>
    String(x.nutrientNumber)===String(nutrientNumber) ||
    x.nutrientId===nutrientNumber ||
    String(x.number)===String(nutrientNumber)
  );
  if(!n) return 0;
  const v = n.value!=null ? n.value : (n.amount!=null ? n.amount : 0);
  return Number(v)||0;
}

async function searchUSDAFood(query){
  const url = `https://api.nal.usda.gov/fdc/v1/foods/search?api_key=DEMO_KEY&pageSize=5&query=${encodeURIComponent(query)}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('USDA request failed ('+res.status+')');
  const data = await res.json();
  const foods = data.foods || [];
  return foods.map(f=>({
    name: f.description,
    cal: usdaGetNutrient(f.foodNutrients, 1008),
    protein: usdaGetNutrient(f.foodNutrients, 1003),
    carbs: usdaGetNutrient(f.foodNutrients, 1005),
    fat: usdaGetNutrient(f.foodNutrients, 1004)
  })).filter(f=>f.cal>0);
}

async function estimateMacros(){
  const nameVal = (document.getElementById('foodName').value||'').trim();
  const servingVal = (document.getElementById('foodServing').value||'').trim();
  const hint = document.getElementById('estimateHint');
  if(!nameVal){ flashInvalid('foodName'); return; }
  hint.textContent = '';

  const food = findFood(nameVal);
  if(food){
    const grams = parseServingToGrams(servingVal, food);
    const factor = grams/100;
    draftFood.calories = String(Math.round(food.cal*factor));
    draftFood.protein = String(Math.round(food.protein*factor*10)/10);
    draftFood.carbs = String(Math.round(food.carbs*factor*10)/10);
    draftFood.fat = String(Math.round(food.fat*factor*10)/10);
    if(!servingVal) draftFood.serving = food.servingLabel;
    renderFuel();
    setTimeout(()=>{
      const hintEl = document.getElementById('estimateHint');
      if(hintEl) hintEl.textContent = `Matched "${food.name}" (built-in) — using ${grams}g (${servingVal || food.servingLabel}). Adjust before saving if needed.`;
    }, 0);
    return;
  }

  hint.textContent = 'Not in our built-in list — checking the USDA food database…';
  try{
    const results = await searchUSDAFood(nameVal);
    if(results.length===0){
      hint.textContent = `No match found in the USDA database either — try a simpler name, or enter macros manually.`;
      return;
    }
    const top = results[0];
    const grams = parseServingToGrams(servingVal, {servingG:100});
    const factor = grams/100;
    draftFood.calories = String(Math.round(top.cal*factor));
    draftFood.protein = String(Math.round(top.protein*factor*10)/10);
    draftFood.carbs = String(Math.round(top.carbs*factor*10)/10);
    draftFood.fat = String(Math.round(top.fat*factor*10)/10);
    if(!servingVal) draftFood.serving = `${grams}g`;
    renderFuel();
    setTimeout(()=>{
      const hintEl = document.getElementById('estimateHint');
      if(hintEl) hintEl.textContent = `Matched "${top.name}" via the USDA database — using ${grams}g. Adjust before saving if needed.`;
    }, 0);
  }catch(e){
    console.error('USDA lookup failed:', e);
    hint.textContent = `Not in our built-in list, and couldn't reach the USDA database (offline?). Try a simpler name, or enter macros manually.`;
  }
}

        <option value="1.9">Very Active (physical job + training)</option>
      </select>
    </div>

    <div class="divider"></div>
    <div class="section-title">Target Physique</div>
    ${suggested ? `<div class="suggest-callout"><span>Based on your logged weight and goal, <b>${escapeHtml(PHYSIQUE_GOALS.find(g=>g.id===suggested).label)}</b> fits best.</span></div>` : `<div class="hint" style="margin-bottom:10px;">Set a goal weight in Settings to get a personalized suggestion here.</div>`}
    <div class="physique-grid" id="physiqueGrid">${physiqueGridHtml(calcSelectedPhysique, suggested)}</div>

    <button class="btn btn-ghost btn-block" id="btnCalc" style="margin-top:14px;">Calculate</button>
    <div class="divider"></div>
    <div class="section-title">Macro Targets</div>
    <div class="row">
      <div class="field"><label>Calories</label><input id="tCal" type="number" value="${t.calories}"></div>
      <div class="field"><label>Protein (g)</label><input id="tPro" type="number" value="${t.protein}"></div>
    </div>
    <div class="row">
      <div class="field"><label>Carbs (g)</label><input id="tCarb" type="number" value="${t.carbs}"></div>
      <div class="field"><label>Fat (g)</label><input id="tFat" type="number" value="${t.fat}"></div>
    </div>
    <button class="btn btn-primary btn-block" id="btnSaveTargets">Save Targets</button>
  `);

  bindPhysiqueGrid(suggested);

  document.getElementById('btnCalc').onclick = ()=>{
    const sex = document.getElementById('calcSex').value;
    const age = Number(document.getElementById('calcAge').value)||28;
    let weight = Number(document.getElementById('calcWeight').value)||0;
    let height = Number(document.getElementById('calcHeight').value)||0;
    const activity = Number(document.getElementById('calcActivity').value);
    if(!weight || !height) return;
    let kg = weight, cm = height;
    if(state.profile.unit !== 'kg'){ kg = weight*0.453592; cm = height*2.54; }
    const bmr = sex==='male' ? (10*kg + 6.25*cm - 5*age + 5) : (10*kg + 6.25*cm - 5*age - 161);
    const tdee = bmr*activity;
    const physique = PHYSIQUE_GOALS.find(g=>g.id===calcSelectedPhysique) || PHYSIQUE_GOALS.find(g=>g.id==='recomp');
    const calories = Math.round(tdee*(1+physique.deficitPct));
    const proteinG = Math.round(kg*physique.proteinPerKg);
    const fatCals = calories*physique.fatPct;
    const fatG = Math.round(fatCals/9);
    const carbG = Math.max(0, Math.round((calories - proteinG*4 - fatCals)/4));
    document.getElementById('tCal').value = calories;
    document.getElementById('tPro').value = proteinG;
    document.getElementById('tCarb').value = carbG;
    document.getElementById('tFat').value = fatG;
  };
  document.getElementById('btnSaveTargets').onclick = ()=>{
    state.profile.targets = {
      calories: Number(document.getElementById('tCal').value)||2000,
      protein: Number(document.getElementById('tPro').value)||150,
      carbs: Number(document.getElementById('tCarb').value)||200,
      fat: Number(document.getElementById('tFat').value)||60
    };
    state.profile.physiqueGoal = calcSelectedPhysique;
    state.profile.setupDone = true;
    saveProfile();
    closeModal();
    renderFuel(); renderHome();
  };
}
